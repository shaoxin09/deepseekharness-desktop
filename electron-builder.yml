appId: ai.ucd.deepseek-harness.desktop.m
productName: DeepSeek Harness
# dsh runs under Electron's Node and reads files through node's fs, so keep
# dependencies as plain files instead of packing them into asar.
asar: false
# node-pty and koffi ship ABI-stable N-API prebuilds, so no Electron rebuild
# is required at package time.
npmRebuild: false
# Direct GitHub downloads of the Electron binary time out on some networks;
# use the npmmirror mirror instead.
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
directories:
  output: release
  buildResources: build
files:
  - "**/*"
  - "!**/*.map"
  - "!release/**"
mac:
  category: public.app-category.developer-tools
  identity: null
  artifactName: ${productName}-${version}-${arch}.${ext}
  target:
    - target: dmg
    - target: zip
win:
  target:
    - target: nsis
    - target: portable
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
